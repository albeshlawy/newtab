<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<style>
  :root{
    --glass: rgba(255,255,255,0.10);
    --glass-strong: rgba(255,255,255,0.16);
    --border: rgba(255,255,255,0.22);
    --text: #fff;
    --muted: rgba(255,255,255,0.72);
    --blur: 22px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    color:var(--text);
    background:#0b0f24;
    overflow-x:hidden;
    min-height:100vh;
  }
  /* ---------- background ---------- */
  #bg{position:fixed;inset:0;z-index:-2;background:
      radial-gradient(1200px 800px at 10% 10%, #3b1d6e 0%, transparent 60%),
      radial-gradient(1000px 700px at 90% 20%, #0e4a7a 0%, transparent 60%),
      radial-gradient(900px 700px at 50% 100%, #7a2e1d 0%, transparent 60%),
      #0b0f24;
    background-size:cover;background-position:center;}
  #bg.image{filter:none}
  .blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;z-index:-1;animation:float 22s ease-in-out infinite}
  .b1{width:420px;height:420px;background:#8b5cf6;top:8%;left:12%}
  .b2{width:360px;height:360px;background:#06b6d4;top:50%;right:10%;animation-delay:-7s}
  .b3{width:300px;height:300px;background:#f97316;bottom:5%;left:35%;animation-delay:-14s}
  body.has-image .blob{display:none}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,-40px) scale(1.1)}66%{transform:translate(-40px,50px) scale(.95)}}

  .glass{
    background:var(--glass);
    border:1px solid var(--border);
    backdrop-filter:blur(var(--blur)) saturate(160%);
    -webkit-backdrop-filter:blur(var(--blur)) saturate(160%);
    box-shadow:0 8px 32px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.25);
  }

  /* ---------- top bar ---------- */
  .topbar{position:fixed;top:18px;right:22px;display:flex;gap:10px;z-index:5}
  .icon-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;cursor:pointer;color:#fff;font-size:18px;transition:.2s}
  .icon-btn:hover{background:var(--glass-strong);transform:translateY(-2px)}
  .icon-btn.active{background:rgba(255,255,255,.3)}

  /* ---------- hero ---------- */
  main{max-width:1100px;margin:0 auto;padding:5vh 24px 40px;display:flex;flex-direction:column;align-items:center}
  .clock{font-size:clamp(56px,8vw,104px);font-weight:700;letter-spacing:-2px;line-height:1;text-shadow:0 6px 30px rgba(0,0,0,.35)}
  .clock small{font-size:.32em;font-weight:600;margin-left:8px;opacity:.85}
  .date{margin-top:10px;font-size:20px;color:var(--muted);font-weight:500}
  .greet{margin-top:8px;font-size:clamp(22px,2.6vw,30px);font-weight:600}

  .search{margin-top:24px;width:min(680px,100%);border-radius:22px;display:flex;align-items:center;padding:6px 8px 6px 20px}
  .search span{font-size:18px;opacity:.8}
  .search input{flex:1;background:none;border:0;outline:0;color:#fff;font-size:18px;padding:14px 12px}
  .search input::placeholder{color:rgba(255,255,255,.6)}

  /* ---------- groups ---------- */
  .groups{margin-top:28px;width:100%;display:grid;gap:16px}
  .group{border-radius:24px;padding:14px 22px 18px}
  .group-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .group-title{font-size:15px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
  .group-title[contenteditable="true"]{outline:1px dashed rgba(255,255,255,.4);padding:2px 6px;border-radius:6px;color:#fff}
  .group-del{display:none;font-size:13px;cursor:pointer;color:#fca5a5}
  body.edit .group-del{display:inline}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:18px}

  /* ---------- 3D tiles ---------- */
  .tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:#fff;perspective:600px;cursor:pointer}
  .icon3d{
    width:64px;height:64px;border-radius:20px;position:relative;display:grid;place-items:center;
    background:linear-gradient(145deg,var(--c1),var(--c2));
    box-shadow:
      0 14px 22px -6px rgba(0,0,0,.55),
      0 4px 0 0 var(--c3),
      inset 0 2px 1px rgba(255,255,255,.55),
      inset 0 -6px 12px rgba(0,0,0,.25);
    transform-style:preserve-3d;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .icon3d::before{ /* glossy top highlight */
    content:"";position:absolute;inset:3px 5px auto 5px;height:45%;border-radius:18px 18px 40% 40%;
    background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));
    pointer-events:none;
  }
  .icon3d img{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4));transform:translateZ(20px);border-radius:8px}
  .icon3d .letter{font-size:30px;font-weight:800;text-shadow:0 3px 4px rgba(0,0,0,.4);transform:translateZ(20px)}
  .tile:hover .icon3d{transform:translateY(-6px) rotateX(14deg) rotateY(var(--ry,0deg));
    box-shadow:0 24px 30px -8px rgba(0,0,0,.6),0 4px 0 0 var(--c3),inset 0 2px 1px rgba(255,255,255,.6),inset 0 -6px 12px rgba(0,0,0,.25)}
  .tile .label{font-size:13.5px;font-weight:500;max-width:104px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px rgba(0,0,0,.5)}

  .tile .ctrl{display:none;position:absolute;top:-6px;width:24px;height:24px;border-radius:50%;font-size:12px;place-items:center;z-index:3;border:1px solid rgba(255,255,255,.4)}
  .tile .ctrl.edit-t{right:8px;background:#3b82f6}
  .tile .ctrl.del-t{left:8px;background:#ef4444}
  body.edit .tile .ctrl{display:grid}
  body.edit .tile .icon3d{animation:wiggle .35s ease-in-out infinite alternate}
  @keyframes wiggle{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}

  .add-tile .icon3d{--c1:rgba(255,255,255,.18);--c2:rgba(255,255,255,.06);--c3:rgba(255,255,255,.12);font-size:34px;font-weight:300}
  .add-tile{display:none}
  body.edit .add-tile{display:flex}
  .add-group{display:none;justify-self:center;padding:12px 22px;border-radius:16px;cursor:pointer;font-weight:600}
  body.edit .add-group{display:block}

  /* ---------- modal ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;place-items:center;z-index:20}
  .modal-bg.open{display:grid}
  .modal{width:min(440px,92vw);border-radius:24px;padding:26px;background:rgba(30,30,50,.45)}
  .modal h3{font-size:20px;margin-bottom:16px}
  .modal label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
  .modal input,.modal select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.08);color:#fff;font-size:15px;outline:none}
  .modal select option{color:#000}
  .row{display:flex;gap:10px;align-items:center}
  .row input[type=color]{width:56px;height:44px;padding:4px}
  .modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
  .btn{padding:11px 18px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.12);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
  .btn:hover{background:rgba(255,255,255,.22)}
  .btn.primary{background:linear-gradient(135deg,#8b5cf6,#3b82f6);border:0}
  .btn.danger{background:rgba(239,68,68,.35)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .check{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
  .check input{width:auto}
</style>
</head>
<body>
<div id="bg"></div>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div class="topbar">
  <div class="icon-btn glass" id="editBtn" title="Edit shortcuts">✎</div>
  <div class="icon-btn glass" id="setBtn" title="Settings">⚙︎</div>
</div>

<main>
  <div class="clock" id="clock">--:--</div>
  <div class="date" id="date"></div>
  <div class="greet" id="greet"></div>

  <form class="search glass" id="searchForm">
    <span>🔍</span>
    <input id="q" placeholder="Search Google or type a URL…" autocomplete="off" autofocus>
  </form>

  <div class="groups" id="groups"></div>
</main>

<!-- tile modal -->
<div class="modal-bg" id="tileModal">
  <div class="modal glass">
    <h3 id="tileTitle">Add shortcut</h3>
    <label>Name</label><input id="tName" placeholder="e.g. PubMed">
    <label>URL</label><input id="tUrl" placeholder="https://pubmed.ncbi.nlm.nih.gov">
    <label>Group</label><select id="tGroup"></select>
    <label>Icon colour (3D tile)</label>
    <div class="row"><input type="color" id="tColor" value="#6d5dfc"><span class="hint">Pick the tile colour</span></div>
    <label>Custom icon URL (optional)</label><input id="tIcon" placeholder="leave empty = automatic">
    <div class="actions">
      <button class="btn" data-close>Cancel</button>
      <button class="btn primary" id="tSave">Save</button>
    </div>
  </div>
</div>

<!-- settings modal -->
<div class="modal-bg" id="setModal">
  <div class="modal glass">
    <h3>Settings</h3>
    <label>Your name</label><input id="sName">
    <label>Background image URL (optional)</label><input id="sBg" placeholder="leave empty = animated gradient">
    <div class="check"><input type="checkbox" id="s24"><span>24-hour clock</span></div>
    <label>Backup</label>
    <div class="row">
      <button class="btn" id="exportBtn">Export</button>
      <button class="btn" id="importBtn">Import</button>
      <button class="btn danger" id="resetBtn">Reset</button>
      <input type="file" id="importFile" accept=".json" hidden>
    </div>
    <div class="actions">
      <button class="btn" data-close>Close</button>
      <button class="btn primary" id="sSave">Save</button>
    </div>
  </div>
</div>

<script>
const KEY = 'glassNewTab.v1';
const DEFAULTS = {
  name: 'Ahmed',
  bg: '',
  h24: false,
  groups: [
    { title: 'AI', tiles: [
      { name:'Claude',   url:'https://claude.ai',              color:'#d97757' },
      { name:'ChatGPT',  url:'https://chatgpt.com',            color:'#10a37f' },
      { name:'Gemini',   url:'https://gemini.google.com',      color:'#4f7cf7' },
      { name:'DeepSeek', url:'https://chat.deepseek.com',      color:'#4d6bfe' },
      { name:'Manus',    url:'https://manus.im',               color:'#3a3a3a' },
    ]},
    { title: 'Research', tiles: [
      { name:'PubMed',         url:'https://pubmed.ncbi.nlm.nih.gov',                         color:'#20558a' },
      { name:'Google Scholar', url:'https://scholar.google.com/citations?user=5ysg2U4AAAAJ',  color:'#4285f4' },
      { name:'ORCID',          url:'https://orcid.org/0009-0006-5923-3783',                   color:'#a6ce39' },
      { name:'ResearchGate',   url:'https://www.researchgate.net/profile/Ahmed-Albeshlawy',   color:'#00ccbb' },
      { name:'Cureus',         url:'https://www.cureus.com',                                  color:'#1d74c6' },
    ]},
    { title: 'Daily', tiles: [
      { name:'Outlook',  url:'https://outlook.live.com',  color:'#0a64d8' },
      { name:'Gmail',    url:'https://mail.google.com',   color:'#ea4335' },
      { name:'YouTube',  url:'https://www.youtube.com',   color:'#ff0033' },
      { name:'LinkedIn', url:'https://www.linkedin.com/in/ahmed-a-albeshlawy-4549b921b', color:'#0a66c2' },
      { name:'GitHub',   url:'https://github.com',        color:'#24292f' },
    ]},
  ]
};

let state;
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.groups) return s; }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULTS));
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
state = load();

/* ---------- colour helpers for 3D tiles ---------- */
function shade(hex, pct){
  let h = hex.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join('');
  let n=parseInt(h,16), r=n>>16, g=n>>8&255, b=n&255;
  const f = pct<0?0:255, p=Math.abs(pct);
  r=Math.round((f-r)*p)+r; g=Math.round((f-g)*p)+g; b=Math.round((f-b)*p)+b;
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function hashColor(str){ let h=0; for(const c of str) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 65% 50%)`; }
function hostOf(url){ try{ return new URL(url).hostname; }catch(e){ return ''; } }
function favicon(t){ return t.icon || `https://www.google.com/s2/favicons?domain=${hostOf(t.url)}&sz=128`; }

/* ---------- clock ---------- */
function tick(){
  const d = new Date();
  let h=d.getHours(), m=String(d.getMinutes()).padStart(2,'0');
  const clock=document.getElementById('clock');
  if(state.h24){ clock.innerHTML = `${String(h).padStart(2,'0')}:${m}`; }
  else { const ap=h>=12?'PM':'AM'; h=h%12||12; clock.innerHTML = `${h}:${m}<small>${ap}</small>`; }
  document.getElementById('date').textContent = d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const hr=d.getHours();
  const g = hr<5?'Good night':hr<12?'Good morning':hr<17?'Good afternoon':hr<22?'Good evening':'Good night';
  document.getElementById('greet').textContent = state.name ? `${g}, ${state.name}` : g;
}

/* ---------- search ---------- */
document.getElementById('searchForm').addEventListener('submit', e=>{
  e.preventDefault();
  const v=document.getElementById('q').value.trim(); if(!v) return;
  const looksUrl=/^(https?:\/\/)?[\w-]+(\.[\w-]+)+(\/\S*)?$/i.test(v) && !v.includes(' ');
  location.href = looksUrl ? (v.startsWith('http')?v:'https://'+v) : 'https://www.google.com/search?q='+encodeURIComponent(v);
});

/* ---------- render ---------- */
function render(){
  const wrap=document.getElementById('groups'); wrap.innerHTML='';
  state.groups.forEach((grp,gi)=>{
    const sec=document.createElement('section'); sec.className='group glass';
    const head=document.createElement('div'); head.className='group-head';
    const title=document.createElement('div'); title.className='group-title'; title.textContent=grp.title;
    if(document.body.classList.contains('edit')){
      title.contentEditable='true';
      title.addEventListener('blur',()=>{ grp.title=title.textContent.trim()||'Group'; save(); });
    }
    const del=document.createElement('span'); del.className='group-del'; del.textContent='Delete group';
    del.onclick=()=>{ if(confirm(`Delete group "${grp.title}" and its shortcuts?`)){ state.groups.splice(gi,1); save(); render(); } };
    head.append(title,del); sec.append(head);

    const tiles=document.createElement('div'); tiles.className='tiles';
    grp.tiles.forEach((t,ti)=>{
      const a=document.createElement('a'); a.className='tile'; a.href=t.url; a.title=t.url;
      const base=t.color||hashColor(t.name);
      const ic=document.createElement('div'); ic.className='icon3d';
      if(base.startsWith('#')){
        ic.style.setProperty('--c1',shade(base,.25)); ic.style.setProperty('--c2',shade(base,-.15)); ic.style.setProperty('--c3',shade(base,-.45));
      } else { ic.style.setProperty('--c1',base); ic.style.setProperty('--c2',base); ic.style.setProperty('--c3','rgba(0,0,0,.4)'); }
      const img=new Image(); img.src=favicon(t); img.alt='';
      img.onerror=()=>{ const s=document.createElement('span'); s.className='letter'; s.textContent=(t.name[0]||'?').toUpperCase(); img.replaceWith(s); };
      ic.append(img);
      // tilt with mouse
      a.addEventListener('mousemove',e=>{ const r=a.getBoundingClientRect(); a.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*24+'deg'); });
      const lb=document.createElement('div'); lb.className='label'; lb.textContent=t.name;
      const ed=document.createElement('div'); ed.className='ctrl edit-t'; ed.textContent='✎';
      const dl=document.createElement('div'); dl.className='ctrl del-t'; dl.textContent='✕';
      ed.onclick=e=>{ e.preventDefault(); openTile(gi,ti); };
      dl.onclick=e=>{ e.preventDefault(); grp.tiles.splice(ti,1); save(); render(); };
      a.addEventListener('click',e=>{ if(document.body.classList.contains('edit')){ e.preventDefault(); openTile(gi,ti);} });
      a.append(ed,dl,ic,lb); tiles.append(a);
    });
    const add=document.createElement('div'); add.className='tile add-tile';
    add.innerHTML='<div class="icon3d">+</div><div class="label">Add</div>';
    add.onclick=()=>openTile(gi,null);
    tiles.append(add); sec.append(tiles); wrap.append(sec);
  });
  const ag=document.createElement('div'); ag.className='add-group glass'; ag.textContent='+ New group';
  ag.onclick=()=>{ const n=prompt('Group name'); if(n){ state.groups.push({title:n,tiles:[]}); save(); render(); } };
  wrap.append(ag);
}

/* ---------- tile modal ---------- */
let editing=null;
function openTile(gi,ti){
  editing={gi,ti};
  const sel=document.getElementById('tGroup'); sel.innerHTML='';
  state.groups.forEach((g,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=g.title; sel.append(o); });
  sel.value=gi;
  const t = ti!=null ? state.groups[gi].tiles[ti] : {name:'',url:'',color:'#6d5dfc',icon:''};
  document.getElementById('tileTitle').textContent = ti!=null?'Edit shortcut':'Add shortcut';
  tName.value=t.name; tUrl.value=t.url; tColor.value=(t.color&&t.color.startsWith('#'))?t.color:'#6d5dfc'; tIcon.value=t.icon||'';
  tileModal.classList.add('open'); tName.focus();
}
document.getElementById('tSave').onclick=()=>{
  let url=tUrl.value.trim(); if(!tName.value.trim()||!url) return alert('Name and URL are required');
  if(!/^https?:\/\//i.test(url)) url='https://'+url;
  const t={name:tName.value.trim(),url,color:tColor.value,icon:tIcon.value.trim()};
  const ng=+tGroup.value;
  if(editing.ti!=null){
    if(ng===editing.gi) state.groups[ng].tiles[editing.ti]=t;
    else { state.groups[editing.gi].tiles.splice(editing.ti,1); state.groups[ng].tiles.push(t); }
  } else state.groups[ng].tiles.push(t);
  save(); render(); tileModal.classList.remove('open');
};

/* ---------- settings ---------- */
function applyBg(){
  const bg=document.getElementById('bg');
  if(state.bg){ bg.style.background=`url("${state.bg}") center/cover no-repeat`; document.body.classList.add('has-image'); }
  else { bg.style.background=''; document.body.classList.remove('has-image'); }
}
setBtn.onclick=()=>{ sName.value=state.name; sBg.value=state.bg; s24.checked=state.h24; setModal.classList.add('open'); };
sSave.onclick=()=>{ state.name=sName.value.trim(); state.bg=sBg.value.trim(); state.h24=s24.checked; save(); applyBg(); tick(); setModal.classList.remove('open'); };
exportBtn.onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='newtab-backup.json'; a.click();
};
importBtn.onclick=()=>importFile.click();
importFile.onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  f.text().then(txt=>{ try{ const s=JSON.parse(txt); if(!s.groups) throw 0; state=s; save(); applyBg(); render(); tick(); setModal.classList.remove('open'); }catch(err){ alert('Invalid backup file'); } });
};
resetBtn.onclick=()=>{ if(confirm('Reset everything to defaults?')){ state=JSON.parse(JSON.stringify(DEFAULTS)); save(); applyBg(); render(); tick(); setModal.classList.remove('open'); } };

/* ---------- edit mode & modals ---------- */
editBtn.onclick=()=>{ document.body.classList.toggle('edit'); editBtn.classList.toggle('active'); render(); };
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal-bg').classList.remove('open'));
document.querySelectorAll('.modal-bg').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('open'); }));
document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.querySelectorAll('.modal-bg.open').forEach(m=>m.classList.remove('open')); });

applyBg(); render(); tick(); setInterval(tick,1000);
</script>
</body>
</html>
